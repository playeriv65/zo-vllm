model: facebook/opt-2.7b
dtype: float16
max_model_len: 128
gpu_memory_utilization: 0.5

lozo:
  eps: 1e-3
  rank: 16
  q: 1
  lr: 0.01
  target_layers: [8, 9, 10, 11, 12, 13, 14, 15]
  target_modules: [q_proj, v_proj]

training:
  num_steps: 100
  eval_interval: 10
  batch_size: 8
  data_size: 128

vllm:
  max_lora_rank: 16
  enable_lora: true
  seed: 42